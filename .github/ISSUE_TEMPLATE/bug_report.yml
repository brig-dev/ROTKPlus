name: Bug report
description: Something does not work
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Please attach `ROTKPlus.log` (copy it before restarting the game, and remove your user name from it).
  - type: input
    id: setup
    attributes:
      label: Setup
      description: Game edition and language, Windows (or Linux) version, Athelas version, ROTKPlus version (first line of the log).
    validations:
      required: true
  - type: input
    id: players
    attributes:
      label: Players and controllers
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The level, what you did just before, what you expected and what you got. A screenshot or video helps.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: ROTKPlus.log
      description: Drag the file here (after removing your user name).
