name: Bug report
description: Something does not work
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Please attach the log of the session (`ROTKPlus_logs` folder; every start of the game writes a new one) and remove your user name from it first: the log shows your game folder, which often contains it. [check_log.py](https://raw.githubusercontent.com/brig-dev/ROTKPlus/main/tools/check_log.py) `--redact` does it for you (see [TESTING.md](https://github.com/brig-dev/ROTKPlus/blob/main/TESTING.md#get-the-log-checker)).
  - type: input
    id: setup
    attributes:
      label: Setup
      description: Game edition and language, Windows (or Linux) version, Athelas version, ROTKPlus version (first line of the log).
    validations:
      required: true
  - type: input
    id: players
    attributes:
      label: Players and controllers
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The level, what you did just before, what you expected and what you got. A screenshot or video helps.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: ROTKPlus log (ROTKPlus_logs)
      description: Drag the file here (after removing your user name).
